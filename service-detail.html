<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Area | DFK</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="dfk-header"></div>

<main>
  <section class="page-head">
    <div class="wrap">
      <a href="areas-of-expertise.html" style="color:var(--gold-soft); font-size:.85rem; font-weight:600;">&larr; Back to Areas of Expertise</a>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="detail-hero">
        <h2 id="svcTitle">Practice Area</h2>
        <p id="svcDesc">Loading...</p>
      </div>
      <h3 class="case-list-heading">Notable Cases</h3>
      <div class="link-grid" id="svcLinks"></div>
      <p class="case-empty" id="svcEmpty" style="display:none;">Case studies for this practice area will be published here soon.</p>
    </div>
  </section>
</main>

<div id="dfk-footer"></div>

<script src="js/services-data.js"></script>
<script src="js/components.js"></script>
<script>
  dfkInitHeaderFooter('areas-of-expertise');

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('service');
  const service = dfkGetServiceBySlug(slug) || DFK_SERVICES[0];

  document.title = service.title + " | DFK";
  document.getElementById('svcTitle').textContent = service.title + ":";
  document.getElementById('svcDesc').textContent = service.description;

  const cases = service.cases || [];
  const linksEl = document.getElementById('svcLinks');
  const emptyEl = document.getElementById('svcEmpty');

  if (cases.length === 0) {
    linksEl.style.display = 'none';
    emptyEl.style.display = 'block';
  } else {
    linksEl.innerHTML = cases.map(c => `
      <a href="case-studies/${c.file}" target="_blank" rel="noopener" class="link-btn case-link-btn">
        <span class="pdf-badge">PDF</span>${c.title}
      </a>
    `).join('');
  }
</script>
</body>
</html>
